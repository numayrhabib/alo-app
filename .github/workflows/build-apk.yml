name: Build Android test app

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["app/**"]

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create a fresh Expo project (always the current Expo version)
        run: npx --yes create-expo-app@latest build --template blank --yes
      - name: Add Alo's libraries
        working-directory: build
        run: |
          npx expo install expo-location expo-notifications expo-constants expo-splash-screen expo-status-bar @react-native-async-storage/async-storage @react-native-community/slider react-native-safe-area-context @expo/vector-icons
          npm install react-native-google-mobile-ads
      - name: Copy Alo's code and icons
        run: |
          pip install -q pillow
          python3 app/make_icons.py
          cp app/App.js app/app.json build/
          rm -rf build/src build/assets
          cp -r app/src build/src
          cp -r app/assets build/assets
      - name: Generate the Android project
        working-directory: build
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: build/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Publish the test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/android/app/build/outputs/apk/release/app-release.apk alo-test.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build alo-test.apk --title "Alo test build" --notes "Built $(date -u '+%d %b %Y %H:%M UTC') from ${GITHUB_SHA::7}"
